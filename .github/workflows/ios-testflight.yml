# iOS TestFlight build.
#
# Started by an upstream Azure DevOps pipeline, which passes the branch to build and its own build
# id for correlation. That pipeline does NOT wait for this run — it goes green the moment the
# dispatch is accepted, so THIS run is the authority on whether the build actually worked.
# Can also be run by hand from the Actions tab.
#
# A mirrored, reviewed copy of this file is version-controlled in the upstream Azure DevOps repo.
# Edit it HERE first, then mirror the change there.
#
# This repo is public so the macOS runners are free and unmetered. It therefore holds only this
# workflow and never any application source: the build clones the real source at run time via
# secrets.AZDO_PAT / secrets.AZDO_REPO_URL. Keep every project path, feed URL and endpoint
# RESOLVED AT RUN TIME or held in a secret — never a literal in this file. Run logs are
# world-readable too (secret VALUES are masked, echoed paths are not), and so are
# workflow_dispatch inputs — never accept a credential as an input here.
#
# REQUIRED GITHUB SECRETS
#   AZDO_PAT, AZDO_REPO_URL            clone the source out of Azure DevOps
#   IOS_DIST_P12_BASE64, P12_PASSWORD  Apple distribution certificate
#   PROVISION_PROFILE_BASE64           App Store provisioning profile
#   ASC_AUTH_KEY_BASE64, ASC_KEY_ID, ASC_ISSUER_ID   App Store Connect API key for altool
#   FEED_USER, FEED_PASS               internal NuGet feed
#   API_URL                            PBI 612 — OPTIONAL. Overrides the API endpoint the built app
#                                      talks to. Unset ⇒ ship appsettings.release.json as committed.

name: iOS Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'master'

      # PBI 612 — supplied by the Azure pipeline that dispatches this run, purely so the two runs can
      # be correlated. Optional, so a manual run from the Actions tab still works.
      #
      # This is the ONLY thing Azure passes besides the branch. Azure does NOT wait for this build:
      # its job goes green the moment GitHub returns 204. Reporting the real outcome back would need
      # the plan-scoped Azure token as an input here, and workflow_dispatch inputs are world-readable
      # on a public repo. See the Azure YAML header for the full reasoning before changing this.
      azureBuildId:
        description: 'Azure DevOps build id that dispatched this run'
        required: false

jobs:
  build:
    runs-on: macos-26
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      # Echoed so an Azure run and a GitHub run can be matched up from either side. Azure cannot
      # link here directly — workflow_dispatch returns 204 with no run id — so this is the join key.
      - name: Azure correlation
        if: inputs.azureBuildId != ''
        run: echo "Dispatched by Azure DevOps build ${{ inputs.azureBuildId }}"

      - name: Checkout
        env:
          SRC_PAT: ${{ secrets.AZDO_PAT }}
          SRC_URL: ${{ secrets.AZDO_REPO_URL }}
        run: |
          set -e
          git clone --branch "${{ github.event.inputs.branch }}" --depth 1 \
            "https://x-access-token:${SRC_PAT}@${SRC_URL}" src

      # PBI 612, ported from the Azure pipeline this replaced. Ephemeral working-copy edit only —
      # the clone is thrown away with the runner. The same appsettings file is shared with the
      # Desktop and Web builds, so this must never become a committed change.
      #
      # ServerURL in appsettings.release.json IS the API base the app talks to — it becomes
      # StaticShared.ApiUrl at startup. Normal case: leave the API_URL secret UNSET and the build
      # ships whatever is committed. Set it only to aim a build at a different API, and remember it
      # then applies to EVERY build until cleared — same bundle id for all of them, so the next
      # TestFlight update REPLACES whatever build a tester already had. There is no in-app picker.
      # (Per-tenant build selection is a separate PBI; it is deliberately not modelled here.)
      #
      # The empty check lives inside the script rather than in a step-level `if:` because the
      # `secrets` context is not available in step conditionals.
      - name: Point the build at a specific API
        working-directory: src
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          set -e
          if [ -z "$API_URL" ]; then
            echo "API_URL secret is unset — shipping the committed appsettings.release.json ServerURL as-is"
            exit 0
          fi
          FILE=$(find . -name appsettings.release.json -not -path '*/bin/*' -not -path '*/obj/*' | head -n1)
          if [ -z "$FILE" ]; then
            echo "::error::No appsettings.release.json found in the checkout."
            exit 1
          fi
          SETTINGS_FILE="$FILE" python3 -c "import json,os; p=os.environ['SETTINGS_FILE']; d=json.load(open(p)); d['ServerURL']=os.environ['API_URL']; json.dump(d, open(p,'w'), indent=2)"
          echo "Patched $FILE ServerURL for this run's build only"

      - name: Prepare SDK
        working-directory: src
        run: |
          set -e
          rm -f global.json
          dotnet --version
          IOS_CSPROJ=$(grep -rl 'net.*-ios' --include=*.csproj . | grep -vi hello | head -n1)
          echo "Resolved project: $IOS_CSPROJ"
          if [ -z "$IOS_CSPROJ" ]; then
            echo "::error::No iOS csproj found."
            exit 1
          fi
          echo "IOS_CSPROJ=$IOS_CSPROJ" >> "$GITHUB_ENV"
          echo "IOS_DIR=$(dirname "$IOS_CSPROJ")" >> "$GITHUB_ENV"

      - name: Restore feed credentials
        working-directory: src
        env:
          FEED_USER: ${{ secrets.FEED_USER }}
          FEED_PASS: ${{ secrets.FEED_PASS }}
        run: |
          set -e
          echo "=== configured sources ==="
          dotnet nuget list source
          SOURCE_NAME=$(dotnet nuget list source | grep -E '^\s*[0-9]+\.' | awk '{print $2}' | grep -v -i '^nuget.org$' | head -n1)
          echo "Resolved source name: '$SOURCE_NAME'"
          if [ -z "$SOURCE_NAME" ]; then
            echo "::error::Could not resolve a non-nuget.org source name from NuGet.Config."
            exit 1
          fi
          dotnet nuget update source "$SOURCE_NAME" \
            --username "$FEED_USER" \
            --password "$FEED_PASS" \
            --store-password-in-clear-text \
            --configfile NuGet.Config

      - name: Install workload
        working-directory: src
        run: dotnet workload install ios

      # GITHUB_RUN_ID, not the Azure build id. App Store Connect rejects a build number lower than
      # one it has already accepted for this version, and run ids are large and always increasing,
      # whereas Azure's Build.BuildId (~2300) is far BELOW the run ids already uploaded. Do not
      # "unify" this with the Azure build number.
      - name: Stamp build number
        working-directory: src
        run: |
          set -e
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_ID" "$IOS_DIR/Info.plist"

      - name: Import certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -e
          KEYCHAIN=build.keychain
          KEYCHAIN_PW=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          EXISTING=$(security list-keychains -d user | sed 's/"//g')
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING
          security default-keychain -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          rm -f cert.p12

          # Apple's WWDR intermediate. An OpenSSL-exported p12 carries only the LEAF certificate, so
          # without this the identity cannot chain to Apple's root and `find-identity -v` omits it as
          # not-valid-for-codesigning -- leaving IDENTITY empty, this step GREEN, and the real failure
          # surfacing 1000 lines later as "No valid iOS code signing keys found in keychain".
          curl -fsSL -o AppleWWDRCAG3.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import AppleWWDRCAG3.cer -k "$KEYCHAIN" -T /usr/bin/codesign

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -E 'Apple Distribution|iPhone Distribution' | head -n1 | sed -E 's/.*"(.*)"/\1/')
          # The lookup above ends in `sed`, which exits 0 on empty input, so `set -e` never fires and an
          # empty IDENTITY used to sail through as -p:CodesignKey="". Fail here instead, and print both
          # listings: expired certs show as CSSMERR_TP_CERT_EXPIRED in the second one, an untrusted
          # chain appears there but not in the first.
          if [ -z "$IDENTITY" ]; then
            echo "::error::No valid distribution identity after import. Valid identities:"
            security find-identity -v -p codesigning "$KEYCHAIN" || true
            echo "All identities (includes expired/untrusted):"
            security find-identity -p codesigning "$KEYCHAIN" || true
            exit 1
          fi
          echo "Using signing identity: $IDENTITY"
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          set -e
          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          security cms -D -i profile.mobileprovision > profile_decoded.plist
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" profile_decoded.plist)
          cp profile.mobileprovision ~/Library/MobileDevice/"Provisioning Profiles"/"$UUID".mobileprovision
          echo "PROVISION_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Diag - what does the keychain look like to MSBuild
        run: |
          echo "--- default keychain ---";      security default-keychain || true
          echo "--- search list ---";           security list-keychains -d user || true
          echo "--- identities, NO keychain arg (this is what MSBuild enumerates) ---"
          security find-identity -v -p codesigning || true
          echo "--- identities in build.keychain explicitly ---"
          security find-identity -v -p codesigning build.keychain || true
          echo "--- CODESIGN_IDENTITY carried over: [$CODESIGN_IDENTITY]"


      # The Xcode path is the CANONICAL Xcode_26.6.app, never the Xcode_26.6.0.app symlink alias:
      # xcodebuild's SDK resolution keys off the real path and fails intermittently through the
      # alias. The actool check is deliberately in the SAME step as the publish, with no gap — an
      # earlier standalone check was observed to pass and then fail minutes later at publish time.
      - name: Publish
        working-directory: src
        run: |
          set -e
          TARGET="/Applications/Xcode_26.6.app"
          DEV="$TARGET/Contents/Developer"
          SDK="$DEV/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk"
          sudo xcode-select -s "$DEV"
          if ! xcodebuild -sdk "$SDK" -find actool >/dev/null 2>&1; then
            echo "::error::actool still unresolvable for Xcode 26.6 right before publish."
            xcodebuild -sdk "$SDK" -find actool
            exit 1
          fi
          dotnet publish "$IOS_CSPROJ" \
            -f net10.0-ios -c Release \
