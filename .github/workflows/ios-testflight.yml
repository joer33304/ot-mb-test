name: iOS Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'master'

jobs:
  build:
    runs-on: macos-26
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Checkout
        env:
          SRC_PAT: ${{ secrets.AZDO_PAT }}
          SRC_URL: ${{ secrets.AZDO_REPO_URL }}
        run: |
          set -e
          git clone --branch "${{ github.event.inputs.branch }}" --depth 1 \
            "https://x-access-token:${SRC_PAT}@${SRC_URL}" src

      - name: Select toolchain
        run: |
          set -e
          FOUND=""
          for APP in $(ls -d /Applications/Xcode_26*.app | sort -Vr); do
            DEV="$APP/Contents/Developer"
            SDK="$DEV/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk"
            if xcodebuild -sdk "$SDK" -find actool >/dev/null 2>&1; then
              FOUND="$DEV"
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::No usable Xcode 26.x found."
            exit 1
          fi
          sudo xcode-select -s "$FOUND"
          xcodebuild -version
          echo "XCODE_DEV_DIR=$FOUND" >> "$GITHUB_ENV"

      - name: Prepare SDK
        working-directory: src
        run: |
          set -e
          rm -f global.json
          dotnet --version
          IOS_CSPROJ=$(grep -rl 'net.*-ios' --include=*.csproj . | grep -vi hello | head -n1)
          echo "Resolved project: $IOS_CSPROJ"
          if [ -z "$IOS_CSPROJ" ]; then
            echo "::error::No iOS csproj found."
            exit 1
          fi
          echo "IOS_CSPROJ=$IOS_CSPROJ" >> "$GITHUB_ENV"
          echo "IOS_DIR=$(dirname "$IOS_CSPROJ")" >> "$GITHUB_ENV"

      - name: Restore feed credentials
        working-directory: src
        env:
          FEED_USER: ${{ secrets.FEED_USER }}
          FEED_PASS: ${{ secrets.FEED_PASS }}
        run: |
          set -e
          echo "=== configured sources ==="
          dotnet nuget list source
          SOURCE_NAME=$(dotnet nuget list source | grep -E '^\s*[0-9]+\.' | awk '{print $2}' | grep -v -i '^nuget.org$' | head -n1)
          echo "Resolved source name: '$SOURCE_NAME'"
          if [ -z "$SOURCE_NAME" ]; then
            echo "::error::Could not resolve a non-nuget.org source name from NuGet.Config."
            exit 1
          fi
          dotnet nuget update source "$SOURCE_NAME" \
            --username "$FEED_USER" \
            --password "$FEED_PASS" \
            --store-password-in-clear-text \
            --configfile NuGet.Config

      - name: Install workload
        working-directory: src
        run: dotnet workload install ios

      - name: Stamp build number
        working-directory: src
        run: |
          set -e
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_ID" "$IOS_DIR/Info.plist"

      - name: Import certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -e
          echo "P12_BASE64 length: ${#P12_BASE64}"
          echo -n "$P12_BASE64" | shasum -a 256
          echo "P12_PASSWORD length: ${#P12_PASSWORD}"
          KEYCHAIN=build.keychain
          KEYCHAIN_PW=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          EXISTING=$(security list-keychains -d user | sed 's/"//g')
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          rm -f cert.p12
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -E 'Apple Distribution|iPhone Distribution' | head -n1 | sed -E 's/.*"(.*)"/\1/')
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          set -e
          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          security cms -D -i profile.mobileprovision > profile_decoded.plist
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" profile_decoded.plist)
          cp profile.mobileprovision ~/Library/MobileDevice/"Provisioning Profiles"/"$UUID".mobileprovision
          echo "PROVISION_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Publish
        working-directory: src
        run: |
          set -e
          dotnet publish "$IOS_CSPROJ" \
            -f net10.0-ios -c Release \
            -p:RuntimeIdentifier=ios-arm64 -p:ArchiveOnBuild=true \
            -p:CodesignKey="$CODESIGN_IDENTITY" \
            -p:CodesignProvision="$PROVISION_UUID" \
            -p:XcodeLocation="$XCODE_DEV_DIR" \
            -o "$GITHUB_WORKSPACE/out"

      - name: Package
        run: |
          set -e
          IPA=$(find "$GITHUB_WORKSPACE/out" -name '*.ipa' | head -n1)
          cp "$IPA" "$GITHUB_WORKSPACE/app.ipa"

      - name: Upload to store
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_AUTH_KEY_BASE64 }}
        run: |
          set -e
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          IPA="$GITHUB_WORKSPACE/app.ipa"
          xcrun altool --validate-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: app.ipa

      - name: Cleanup
        if: always()
        run: security delete-keychain build.keychain || true
